name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shellcheck
        run: |
          shellcheck -x entrypoint.sh vm-console vm-qmp test/smoke.sh

  smoke-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub's Linux runners expose KVM, and the network devices only need their modules loaded
      - name: Enable KVM and the network devices
        run: |
          sudo modprobe tun
          sudo modprobe vhost_net
          ls -l /dev/kvm /dev/net/tun /dev/vhost-net
      - name: Build the image
        run: |
          sudo podman build -t localhost/qemu-vm:test -f Containerfile .
      - name: Boot a cloud image and stop it
        run: |
          sudo ./test/smoke.sh localhost/qemu-vm:test

  publish:
    # Only a version tag publishes, so the image a host pins never changes underneath it
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - smoke-test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/italypaleale/qemu-vm
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
