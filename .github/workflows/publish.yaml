name: Publish

on:
  # Called by the release workflow once release-please has tagged a release
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish, such as v0.1.0
        required: true
        type: string
  # Run by hand to publish an existing tag again, for example after a failed publish
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      # The tag is checked out rather than whatever triggered the run, so a manual run publishes exactly what was released
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version comes from the input and the commit from the checkout, since neither is the ref the run was started on
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ghcr.io/italypaleale/qemu-vm
          tags: |
            type=semver,pattern=v{{version}},value=${{ inputs.tag }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ inputs.tag }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
