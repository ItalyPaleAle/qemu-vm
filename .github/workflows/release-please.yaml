name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Two pushes in quick succession must not race to open the same release PR or create the same tag
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Opens or updates the release PR, and once that PR is merged, tags the release and creates it on GitHub
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # A tag created with GITHUB_TOKEN starts no other workflow, so the release is tested and published from this run
  test:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yaml
    permissions:
      contents: read

  publish:
    needs:
      - release-please
      - test
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      packages: write
